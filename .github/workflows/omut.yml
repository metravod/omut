name: omut

# This repository's own meta, checked by the omut built from this commit.
# Warnings fail too, so the badge in README.md says whether the meta is
# fresh, not only well-formed. The weekly run catches what goes stale with
# time alone, such as `verified` older than 30 days.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/omut check --fail-on warn
